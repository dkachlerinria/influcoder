method: InfluCoder
# Supported methods: Grad_Dot, Grad_Sim, LESS, DataInf, EKFAC, InfluCoder
# (InfluCoder is run via methods/influcoder_attribute.py, not methods/dattri.py --
#  see that script's docstring)

task: "Counterfact"
subset: "Pythia-1b"
# Supported task: Counterfact, ftrace
# Supported subset: Pythia-1b, Llama-3.2-1B, Llama-3.1-8B

base_model_path: "EleutherAI/pythia-1b"
checkpoint: "DataAttributionEval/Pythia-1b-counterfactual"
device: "cuda"

##################################
# InfluCoder hyperparameters -- see toxicity-bias-influcoder.yaml for what each does
encoder_model: "jhu-clsp/ettin-encoder-68m"
encoder_max_len: 1024
max_len: 1024
proj_dim: 8192
n_teacher_train: 500
n_eval_train: 250
epochs: 8
hard_ratio: 0.5
lr: 5.0e-5
seed: 0
select_best_on: "aggregated"
##################################

save_path: ./results/factual-attribution-influcoder/
